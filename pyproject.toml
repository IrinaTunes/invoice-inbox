[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-inbox"
version = "0.1.0"
description = "Сканы счетов → структурированный реестр XLSX с проверкой ИНН и сумм"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "reportlab>=4", "pillow>=10"]

[project.scripts]
invoice-inbox = "invoice_inbox.cli:main"

[tool.setuptools.packages.find]
include = ["invoice_inbox*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
