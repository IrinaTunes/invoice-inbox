name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Системные утилиты OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-rus

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Линтер
        run: ruff check .

      - name: Тесты
        run: pytest -q

      - name: Демо-прогон на samples
        run: |
          python -m invoice_inbox samples -o out/registry.xlsx --json out/registry.json
          python - <<'PY'
          import json, pathlib
          rows = json.loads(pathlib.Path("out/registry.json").read_text(encoding="utf-8"))
          assert len(rows) == 3, f"ожидали 3 документа, получили {len(rows)}"
          assert sum(1 for r in rows if r["status"] == "проверить") == 1
          print("Демо-реестр корректен:", len(rows), "документа")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: registry-py${{ matrix.python-version }}
          path: |
            out/registry.xlsx
            out/registry.json
